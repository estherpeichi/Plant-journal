<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🌿 P's 植物紀錄</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:'Noto Sans TC',sans-serif;
  color:#2c3a2c;
  background:#ede8df;
  background-image:
    radial-gradient(ellipse at 12% 10%, rgba(255,255,248,0.90) 0%,transparent 48%),
    radial-gradient(ellipse at 88% 6%,  rgba(250,246,238,0.75) 0%,transparent 44%),
    radial-gradient(ellipse at 60% 88%, rgba(255,253,245,0.70) 0%,transparent 50%),
    radial-gradient(ellipse at 4%  85%, rgba(248,244,234,0.65) 0%,transparent 46%),
    radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.30) 0%,transparent 70%);
  background-attachment:fixed;
}

/* ── Glass ── */
.glass{
  background:rgba(255,255,255,0.32);
  backdrop-filter:blur(18px) saturate(1.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid rgba(255,255,255,0.55);
  box-shadow:0 4px 24px rgba(70,110,70,0.10),inset 0 1px 0 rgba(255,255,255,0.6);
}

/* ── Header ── */
header{
  background:rgba(255,255,255,0.26);
  backdrop-filter:blur(22px) saturate(1.6);
  -webkit-backdrop-filter:blur(22px) saturate(1.6);
  border-bottom:1px solid rgba(255,255,255,0.52);
  box-shadow:0 2px 16px rgba(70,110,70,0.09);
  padding:16px 24px 0;
  position:sticky;top:0;z-index:50;
}
.header-inner{max-width:980px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo-title{font-size:21px;font-weight:700;color:#3a6040;font-family:'Noto Serif TC',serif;letter-spacing:1px}
.logo-count{font-size:11px;color:rgba(50,90,50,0.4);margin-left:3px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab-btn{
  background:none;border:none;border-bottom:2px solid transparent;
  color:rgba(45,75,45,0.45);padding:8px 16px;
  cursor:pointer;font-size:13px;font-weight:400;
  font-family:'Noto Sans TC',sans-serif;transition:all 0.2s;white-space:nowrap;
}
.tab-btn.active{border-bottom-color:#3a6040;color:#3a6040;font-weight:700}

/* ── Main ── */
main{max-width:980px;margin:0 auto;padding:24px 16px}
.section{display:none}.section.active{display:block}

/* ── Controls ── */
.controls{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.ctrl-input,.ctrl-select{
  background:rgba(255,255,255,0.48);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.68);
  border-radius:12px;color:#2c3a2c;padding:9px 14px;font-size:13px;
  font-family:'Noto Sans TC',sans-serif;outline:none;
  box-shadow:0 2px 8px rgba(70,110,70,0.07),inset 0 1px 0 rgba(255,255,255,0.7);
  transition:border-color 0.2s,box-shadow 0.2s;
}
.ctrl-input:focus,.ctrl-select:focus{
  border-color:rgba(58,96,64,0.45);
  box-shadow:0 0 0 3px rgba(58,96,64,0.10),inset 0 1px 0 rgba(255,255,255,0.7);
}
.ctrl-input{flex:1;min-width:180px}
.ctrl-select{cursor:pointer}
.btn-primary{
  background:linear-gradient(135deg,#63956a,#3a6040);
  border:none;border-radius:12px;color:#fff;
  padding:9px 18px;cursor:pointer;font-size:13px;font-weight:700;
  white-space:nowrap;font-family:'Noto Sans TC',sans-serif;
  box-shadow:0 3px 14px rgba(58,96,64,0.28);
  transition:opacity 0.2s,transform 0.15s;
}
.btn-primary:hover{opacity:0.88;transform:translateY(-1px)}
.btn-secondary{
  background:rgba(255,255,255,0.45);border:1px solid rgba(255,255,255,0.65);
  border-radius:12px;color:rgba(45,75,45,0.65);
  padding:9px 16px;cursor:pointer;font-size:13px;
  font-family:'Noto Sans TC',sans-serif;transition:all 0.2s;
}
.btn-secondary:hover{background:rgba(255,255,255,0.68)}

/* ── Stats ── */
.stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stat-card{
  border-radius:14px;padding:10px 18px;flex:1;min-width:90px;
  background:rgba(255,255,255,0.38);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.62);
  box-shadow:0 2px 12px rgba(70,110,70,0.08),inset 0 1px 0 rgba(255,255,255,0.72);
}
.stat-label{font-size:10px;color:rgba(45,75,45,0.5);margin-bottom:2px}
.stat-value{font-size:18px;font-weight:700;color:#3a6040}

/* ── Plant Grid ── */
.plant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.plant-card{
  border-radius:22px;display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  background:rgba(255,255,255,0.36);
  backdrop-filter:blur(22px) saturate(1.5);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid rgba(255,255,255,0.64);
  box-shadow:0 4px 22px rgba(70,110,70,0.10),inset 0 1px 0 rgba(255,255,255,0.72);
  transition:transform 0.22s,box-shadow 0.22s;
}
.plant-card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 44px rgba(70,110,70,0.18),inset 0 1px 0 rgba(255,255,255,0.8);
}
.card-photo{
  width:100%;height:164px;position:relative;overflow:hidden;cursor:pointer;
  background:linear-gradient(135deg,rgba(170,215,162,0.55),rgba(140,190,132,0.38));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.card-photo img.card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-photo-hint{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,0.22));
  color:rgba(255,255,255,0.88);font-size:10px;text-align:center;
  padding:14px 0 6px;opacity:0;transition:opacity 0.2s;pointer-events:none;
}
.card-photo:hover .card-photo-hint{opacity:1}
.card-body{padding:15px 17px 15px;display:flex;flex-direction:column;gap:10px}
.new-badge{
  position:absolute;top:10px;right:10px;z-index:2;
  background:linear-gradient(135deg,#63956a,#3a6040);
  color:#fff;font-size:9px;font-weight:700;
  padding:3px 9px;border-radius:99px;letter-spacing:0.5px;
  box-shadow:0 2px 8px rgba(58,96,64,0.35);
}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-name{font-size:17px;font-weight:700;color:#1e2e1e;font-family:'Noto Serif TC',serif;line-height:1.25}
.card-meta{font-size:11px;color:rgba(45,75,45,0.5);margin-top:3px}
.card-actions{display:flex;gap:5px;flex-shrink:0}
.card-actions button{
  background:rgba(255,255,255,0.52);border:1px solid rgba(255,255,255,0.7);
  border-radius:8px;color:rgba(45,75,45,0.55);
  cursor:pointer;font-size:13px;padding:4px 7px;transition:background 0.15s;
}
.card-actions button:hover{background:rgba(255,255,255,0.82)}
.card-info{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.info-cell{
  background:rgba(255,255,255,0.32);border:1px solid rgba(255,255,255,0.55);
  border-radius:10px;padding:7px 10px;
}
.info-label{font-size:9px;color:rgba(45,75,45,0.44);margin-bottom:2px;letter-spacing:0.3px}
.info-value{font-size:12px;color:#2c3a2c;font-weight:500;line-height:1.3}
.info-value.today{color:#3a6040;font-weight:700}
.card-note{font-size:11px;color:rgba(45,75,45,0.48);border-top:1px solid rgba(255,255,255,0.5);padding-top:8px;font-style:italic}
.card-diary-btn{
  font-size:11px;color:#3a6040;background:none;border:none;
  cursor:pointer;text-align:left;padding:0;font-family:'Noto Sans TC',sans-serif;
  text-decoration:underline;text-underline-offset:2px;opacity:0.8;
}
.card-diary-btn:hover{opacity:1}
.empty{text-align:center;color:rgba(45,75,45,0.32);padding:60px 0;font-size:15px}

/* ── Purchase Tab ── */
.purchase-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.purchase-stat{
  border-radius:18px;padding:18px 16px;text-align:center;
  background:rgba(255,255,255,0.40);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.66);
  box-shadow:0 4px 20px rgba(70,110,70,0.09),inset 0 1px 0 rgba(255,255,255,0.75);
}
.purchase-stat-emoji{font-size:22px;margin-bottom:4px}
.purchase-stat-value{font-size:20px;font-weight:700;color:#3a6040;font-family:'Noto Serif TC',serif}
.purchase-stat-label{font-size:11px;color:rgba(45,75,45,0.44);margin-top:2px}
.month-group{margin-bottom:22px}
.month-header{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:700;color:#3a6040;
  padding:7px 14px;margin-bottom:8px;
  background:rgba(255,255,255,0.38);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:10px;
}
.month-total{font-size:11px;font-weight:400;color:rgba(45,75,45,0.52)}
.purchase-list{display:flex;flex-direction:column;gap:8px}
.purchase-item{
  border-radius:14px;padding:13px 16px;
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,0.40);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.64);
  box-shadow:0 2px 10px rgba(70,110,70,0.07);
  transition:transform 0.15s;
}
.purchase-item:hover{transform:translateX(3px)}
.purchase-icon{font-size:22px;flex-shrink:0}
.purchase-info{flex:1;min-width:0}
.purchase-name{font-weight:600;color:#1e2e1e;margin-bottom:2px;font-size:14px}
.purchase-sub{font-size:11px;color:rgba(45,75,45,0.48);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.purchase-price-col{text-align:right;flex-shrink:0}
.purchase-amount{font-size:16px;font-weight:700;color:#3a6040}
.purchase-type{font-size:10px;color:rgba(45,75,45,0.4)}

/* ── Wish List ── */
.wish-controls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.wish-input{
  flex:1;min-width:140px;
  background:rgba(255,255,255,0.48);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.68);border-radius:12px;
  color:#2c3a2c;padding:9px 14px;font-size:13px;
  font-family:'Noto Sans TC',sans-serif;outline:none;
}
.wish-list{display:flex;flex-direction:column;gap:8px}
.wish-item{
  border-radius:14px;padding:12px 16px;
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,0.40);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.62);
  box-shadow:0 2px 10px rgba(70,110,70,0.07);
  transition:opacity 0.25s;
}
.wish-item.done{opacity:0.48}
.wish-item.done .wish-name{text-decoration:line-through;color:rgba(45,75,45,0.55)}
.wish-check{
  width:20px;height:20px;border-radius:6px;
  border:2px solid rgba(58,96,64,0.38);
  background:rgba(255,255,255,0.6);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;transition:all 0.15s;
}
.wish-check.checked{background:#3a6040;border-color:#3a6040;color:#fff}
.wish-name{flex:1;font-size:14px;color:#2c3a2c}
.wish-note-text{font-size:11px;color:rgba(45,75,45,0.44);margin-top:1px}
.wish-del{background:none;border:none;color:rgba(45,75,45,0.28);cursor:pointer;font-size:18px;line-height:1}
.wish-del:hover{color:rgba(180,55,55,0.55)}

/* ── Timeline Modal ── */
.timeline-wrap{display:flex;flex-direction:column;gap:0;position:relative;padding-left:22px}
.timeline-wrap::before{
  content:'';position:absolute;left:7px;top:0;bottom:0;
  width:2px;background:linear-gradient(to bottom,rgba(58,96,64,0.28),rgba(58,96,64,0.04));
  border-radius:2px;
}
.tl-entry{position:relative;padding:0 0 18px 18px}
.tl-dot{
  position:absolute;left:-8px;top:5px;
  width:12px;height:12px;border-radius:50%;
  background:#3a6040;border:2.5px solid rgba(255,255,255,0.9);
  box-shadow:0 0 0 2px rgba(58,96,64,0.22);
}
.tl-date-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.tl-date{font-size:10px;color:rgba(45,75,45,0.42)}
.tl-del{background:none;border:none;color:rgba(45,75,45,0.22);cursor:pointer;font-size:14px}
.tl-del:hover{color:rgba(180,55,55,0.5)}
.tl-text{font-size:13px;color:#2c3a2c;line-height:1.6}
.tl-img{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:7px}
.tl-add-area{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.tl-textarea{
  flex:1;
  background:rgba(255,255,255,0.52);border:1px solid rgba(255,255,255,0.7);
  border-radius:11px;color:#2c3a2c;padding:9px 12px;font-size:13px;
  font-family:'Noto Sans TC',sans-serif;outline:none;resize:none;min-height:64px;
}
.tl-empty{font-size:13px;color:rgba(45,75,45,0.35);padding:8px 0}

/* ── Modal ── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(60,95,60,0.22);
  backdrop-filter:blur(7px);
  z-index:100;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}
.modal-box{
  background:rgba(236,247,234,0.80);
  backdrop-filter:blur(30px) saturate(1.7);
  -webkit-backdrop-filter:blur(30px) saturate(1.7);
  border:1px solid rgba(255,255,255,0.78);
  box-shadow:0 18px 64px rgba(50,90,50,0.20),inset 0 1px 0 rgba(255,255,255,0.92);
  border-radius:26px;padding:28px;width:100%;max-width:500px;
  max-height:88vh;overflow-y:auto;
}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:18px;font-weight:700;color:#3a6040;font-family:'Noto Serif TC',serif}
.modal-close{
  background:rgba(255,255,255,0.52);border:1px solid rgba(255,255,255,0.7);
  border-radius:8px;color:rgba(45,75,45,0.5);font-size:15px;cursor:pointer;padding:4px 9px;
}

/* ── Form ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .span2{grid-column:span 2}
.form-label{font-size:11px;color:rgba(45,75,45,0.5);margin-bottom:5px;display:block;letter-spacing:0.4px}
.form-input,.form-select,.form-textarea{
  background:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.74);
  border-radius:11px;color:#2c3a2c;padding:9px 13px;
  font-size:13px;width:100%;outline:none;
  font-family:'Noto Sans TC',sans-serif;
  box-shadow:0 1px 4px rgba(70,110,70,0.06),inset 0 1px 0 rgba(255,255,255,0.82);
  transition:border-color 0.2s,box-shadow 0.2s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  border-color:rgba(58,96,64,0.42);
  box-shadow:0 0 0 3px rgba(58,96,64,0.09),inset 0 1px 0 rgba(255,255,255,0.82);
}
.form-textarea{resize:vertical;min-height:64px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;padding-top:6px;margin-top:4px}

/* ── Photo upload area in form ── */
.photo-upload-area{
  width:100%;height:120px;border-radius:12px;
  border:2px dashed rgba(58,96,64,0.28);
  background:rgba(255,255,255,0.38);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:6px;cursor:pointer;
  transition:border-color 0.2s,background 0.2s;position:relative;overflow:hidden;
}
.photo-upload-area:hover{border-color:rgba(58,96,64,0.5);background:rgba(255,255,255,0.55)}
.photo-upload-area img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px}
.photo-hint{font-size:11px;color:rgba(45,75,45,0.42);text-align:center;line-height:1.6}

.version-note{font-size:10px;color:rgba(45,75,45,0.3);text-align:right;padding-top:10px}

@media(max-width:520px){
  .purchase-stats{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}.form-grid .span2{grid-column:span 1}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span style="font-size:22px">🌿</span>
      <span class="logo-title">P's 植物紀錄</span>
      <span class="logo-count" id="logo-count"></span>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="plants">🪴 我的植物</button>
      <button class="tab-btn" data-tab="purchases">🛒 購買紀錄</button>
      <button class="tab-btn" data-tab="wishlist">✨ Wish List</button>
    </nav>
  </div>
</header>

<main>
  <!-- Plants -->
  <section id="tab-plants" class="section active">
    <div class="controls">
      <input class="ctrl-input" type="text" id="search-input" placeholder="🔍 搜尋植物名稱、位置、店家…"/>
      <select class="ctrl-select" id="filter-type">
        <option value="">全部類型</option>
        <option>觀葉</option><option>多肉</option><option>蕨類</option><option>樹木</option><option>其他</option>
      </select>
      <button class="btn-primary" id="btn-open-add">＋ 新增植物</button>
    </div>
    <div class="stats">
      <div class="stat-card"><div class="stat-label">總植物數</div><div class="stat-value" id="stat-total">—</div></div>
      <div class="stat-card"><div class="stat-label">今天入手</div><div class="stat-value" id="stat-today">—</div></div>
      <div class="stat-card"><div class="stat-label">本月入手</div><div class="stat-value" id="stat-month">—</div></div>
    </div>
    <div class="plant-grid" id="plant-grid"></div>
    <div class="empty" id="plant-empty" style="display:none">沒有符合條件的植物 🌱</div>
  </section>

  <!-- Purchases -->
  <section id="tab-purchases" class="section">
    <div class="purchase-stats">
      <div class="purchase-stat"><div class="purchase-stat-emoji">💰</div><div class="purchase-stat-value" id="stat-spend">—</div><div class="purchase-stat-label">總花費</div></div>
      <div class="purchase-stat"><div class="purchase-stat-emoji">🧾</div><div class="purchase-stat-value" id="stat-count">—</div><div class="purchase-stat-label">購買筆數</div></div>
      <div class="purchase-stat"><div class="purchase-stat-emoji">📊</div><div class="purchase-stat-value" id="stat-avg">—</div><div class="purchase-stat-label">平均單價</div></div>
    </div>
    <div id="purchase-sections"></div>
    <div class="empty" id="purchase-empty" style="display:none">還沒有購買紀錄 🛒</div>
  </section>

  <!-- Wish List -->
  <section id="tab-wishlist" class="section">
    <div class="wish-controls">
      <input class="wish-input" id="wish-input" placeholder="🌱 想要的植物名稱…"/>
      <input class="wish-input" id="wish-note-input" placeholder="備注（可略）" style="max-width:180px"/>
      <button class="btn-primary" id="btn-add-wish">＋ 加入</button>
    </div>
    <div class="wish-list" id="wish-list"></div>
    <div class="empty" id="wish-empty" style="display:none">Wish List 是空的，快來許願 🌱</div>
  </section>
</main>

<!-- Plant Modal -->
<div class="modal-overlay" id="modal-plant">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-plant-title">新增植物</div>
      <button class="modal-close" id="plant-modal-close">✕</button>
    </div>
    <div class="form-grid">
      <div class="span2">
        <label class="form-label">植物照片</label>
        <div class="photo-upload-area" id="photo-upload-area" onclick="document.getElementById('f-photo-file').click()">
          <img id="photo-preview" src="" style="display:none"/>
          <div id="photo-placeholder" style="display:flex;flex-direction:column;align-items:center;gap:6px">
            <span style="font-size:28px">📷</span>
            <div class="photo-hint">點擊上傳照片<br>（支援 JPG / PNG）</div>
          </div>
          <input type="file" id="f-photo-file" accept="image/*" style="display:none"/>
        </div>
      </div>
      <div class="span2">
        <label class="form-label">植物名稱 *</label>
        <input class="form-input" id="f-name" placeholder="例：虎尾蘭"/>
      </div>
      <div>
        <label class="form-label">類型</label>
        <select class="form-select" id="f-type">
          <option>觀葉</option><option>多肉</option><option>蕨類</option><option>樹木</option><option>其他</option>
        </select>
      </div>
      <div>
        <label class="form-label">擺放位置</label>
        <select class="form-select" id="f-location">
          <option>陽台</option><option>客廳</option><option>房間</option><option>悶箱</option>
        </select>
      </div>
      <div>
        <label class="form-label">澆水頻率</label>
        <select class="form-select" id="f-water">
          <option>2-3天一次</option><option>每週一次</option><option>2週一次</option><option>每月一次</option>
        </select>
      </div>
      <div>
        <label class="form-label">光照需求</label>
        <select class="form-select" id="f-light">
          <option>全日照</option><option>半日照</option><option>散射光</option><option>耐陰</option>
        </select>
      </div>
      <div class="span2">
        <label class="form-label">入手日期</label>
        <input type="date" class="form-input" id="f-date"/>
      </div>
      <div>
        <label class="form-label">購入價格（元）</label>
        <input type="number" class="form-input" id="f-price" placeholder="0" min="0"/>
      </div>
      <div>
        <label class="form-label">購入店家</label>
        <input class="form-input" id="f-shop" placeholder="例：花時間花藝"/>
      </div>
      <div class="span2">
        <label class="form-label">備忘錄</label>
        <textarea class="form-textarea" id="f-note" placeholder="養護心得、特殊注意事項…"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" id="btn-plant-cancel">取消</button>
      <button class="btn-primary" id="btn-plant-save">儲存</button>
    </div>
    <div class="version-note" id="version-note"></div>
  </div>
</div>

<!-- Diary Modal -->
<div class="modal-overlay" id="modal-diary">
  <div class="modal-box" style="max-width:460px">
    <div class="modal-header">
      <div class="modal-title" id="diary-modal-title">成長日記</div>
      <button class="modal-close" id="diary-modal-close">✕</button>
    </div>
    <div class="timeline-wrap" id="timeline-wrap"></div>
    <div class="tl-add-area">
      <textarea class="tl-textarea" id="tl-new-text" placeholder="寫下今天的觀察、澆水記錄、新葉…" rows="3"></textarea>
      <button class="btn-primary" id="btn-add-tl">記錄</button>
    </div>
  </div>
</div>

<script>
// ── Storage ──────────────────────────────────
const SKEY   = 'plant_journal_v2';
const WKEY   = 'plant_wishlist_v1';
const DKEY   = 'plant_diary_v1';
const DATA_V = 2;

function loadPlants(){
  try{
    const raw=localStorage.getItem(SKEY);
    if(!raw) return null;
    const obj=JSON.parse(raw);
    if(obj.version===1){
      obj.plants=obj.plants.map(p=>({photo:'',...p}));
      obj.version=2;
      localStorage.setItem(SKEY,JSON.stringify(obj));
    }
    return obj;
  }catch(e){return null;}
}
function savePlants(){
  localStorage.setItem(SKEY,JSON.stringify({version:DATA_V,plants,savedAt:new Date().toISOString()}));
}
function loadWishes(){try{return JSON.parse(localStorage.getItem(WKEY)||'[]');}catch(e){return[];}}
function saveWishes(){localStorage.setItem(WKEY,JSON.stringify(wishes));}
function loadDiaries(){try{return JSON.parse(localStorage.getItem(DKEY)||'{}');}catch(e){return{};}}
function saveDiaries(){localStorage.setItem(DKEY,JSON.stringify(diaries));}

// ── State ────────────────────────────────────
const DEFAULT=[
  {id:1,name:'虎尾蘭',type:'觀葉',location:'客廳',water:'每週一次',light:'散射光',acquiredDate:'2024-03-15',price:280,shop:'花時間花藝',note:'非常好養，葉片挺拔',photo:''},
  {id:2,name:'圓葉椒草',type:'觀葉',location:'房間',water:'每週一次',light:'散射光',acquiredDate:'2024-07-02',price:150,shop:'綠意盎然',note:'',photo:''},
  {id:3,name:'玉露',type:'多肉',location:'悶箱',water:'2週一次',light:'散射光',acquiredDate:'2025-01-20',price:320,shop:'多肉星球',note:'喜歡涼爽環境',photo:''},
  {id:4,name:'波士頓蕨',type:'蕨類',location:'陽台',water:'2-3天一次',light:'散射光',acquiredDate:'2025-11-01',price:200,shop:'花時間花藝',note:'需要保持濕潤',photo:''},
  {id:5,name:'薰衣草',type:'其他',location:'陽台',water:'每週一次',light:'全日照',acquiredDate:'2026-05-09',price:120,shop:'香草園',note:'今天剛買的！',photo:''},
];

const loaded=loadPlants();
let plants  = loaded ? loaded.plants : DEFAULT;
let wishes  = loadWishes();
let diaries = loadDiaries();
let nextId  = plants.reduce((m,p)=>Math.max(m,p.id),0)+1;
let editingId=null, diaryId=null, pendingPhoto=null;

const TODAY=new Date().toISOString().split('T')[0];
const EMOJI={觀葉:'🌿',多肉:'🪨',蕨類:'🌱',樹木:'🌳',其他:'🪴'};

// ── Helpers ──────────────────────────────────
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function duration(ds){
  const a=new Date(ds);a.setHours(0,0,0,0);
  const t=new Date();t.setHours(0,0,0,0);
  const td=Math.round((t-a)/86400000);
  if(td===0) return null;
  if(td<0) return '未來日期';
  let y=t.getFullYear()-a.getFullYear(),mo=t.getMonth()-a.getMonth(),d=t.getDate()-a.getDate();
  if(d<0){mo--;const p=new Date(t.getFullYear(),t.getMonth(),0);d+=p.getDate();}
  if(mo<0){y--;mo+=12;}
  const pts=[];
  if(y)pts.push(`${y}年`);if(mo)pts.push(`${mo}個月`);if(d)pts.push(`${d}天`);
  return pts.join('')||'今天';
}

// ── Tabs ─────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-'+b.dataset.tab).classList.add('active');
  });
});

// ── Render Plants ─────────────────────────────
function renderPlants(){
  const q=document.getElementById('search-input').value.trim().toLowerCase();
  const ft=document.getElementById('filter-type').value;
  const list=plants.filter(p=>{
    const hit=!q||[p.name,p.shop||'',p.location||'',p.type||'',p.note||'']
      .some(v=>v.toLowerCase().includes(q));
    return hit&&(!ft||p.type===ft);
  });

  const now=new Date();
  document.getElementById('logo-count').textContent=`${plants.length} 株`;
  document.getElementById('stat-total').textContent=`${plants.length} 株`;
  document.getElementById('stat-today').textContent=`${plants.filter(p=>p.acquiredDate===TODAY).length} 株`;
  document.getElementById('stat-month').textContent=`${plants.filter(p=>{
    const d=new Date(p.acquiredDate);
    return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  }).length} 株`;

  const grid=document.getElementById('plant-grid');
  const empty=document.getElementById('plant-empty');
  if(!list.length){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';

  grid.innerHTML=list.map(p=>{
    const dur=duration(p.acquiredDate);
    const isToday=dur===null;
    const entries=(diaries[p.id]||[]).length;
    const photoEl=p.photo
      ?`<img class="card-img" src="${p.photo}" />`
      :`<span style="font-size:46px;position:relative;z-index:1">${EMOJI[p.type]||'🪴'}</span>`;
    return `
    <div class="plant-card">
      ${isToday?'<div class="new-badge">NEW</div>':''}
      <div class="card-photo" onclick="triggerCardPhoto(${p.id})">
        ${photoEl}
        <div class="card-photo-hint">點擊更換照片</div>
        <input type="file" id="cpi-${p.id}" accept="image/*" style="display:none"
               onchange="onCardPhoto(event,${p.id})"/>
      </div>
      <div class="card-body">
        <div class="card-top">
          <div>
            <div class="card-name">${esc(p.name)}</div>
            <div class="card-meta">${esc(p.type)} · ${esc(p.location)}</div>
          </div>
          <div class="card-actions">
            <button onclick="openDiary(${p.id})" title="成長日記">📖</button>
            <button onclick="openEdit(${p.id})" title="編輯">✏️</button>
            <button onclick="delPlant(${p.id})" title="刪除">🗑</button>
          </div>
        </div>
        <div class="card-info">
          <div class="info-cell"><div class="info-label">💧 澆水</div><div class="info-value">${esc(p.water)}</div></div>
          <div class="info-cell"><div class="info-label">☀️ 光照</div><div class="info-value">${esc(p.light)}</div></div>
          <div class="info-cell"><div class="info-label">⏳ 種植</div>
            <div class="info-value${isToday?' today':''}">
              ${isToday?'今天剛到家 🎉':dur}
            </div>
          </div>
          <div class="info-cell"><div class="info-label">📍 位置</div><div class="info-value">${esc(p.location)}</div></div>
        </div>
        ${p.note?`<div class="card-note">"${esc(p.note)}"</div>`:''}
        <button class="card-diary-btn" onclick="openDiary(${p.id})">
          📖 成長日記 ${entries?`（${entries} 則）`:'— 開始記錄'}
        </button>
      </div>
    </div>`;
  }).join('');
}

// ── Render Purchases (月份分組) ───────────────
function renderPurchases(){
  const items=[...plants].filter(p=>p.price>0)
    .sort((a,b)=>new Date(b.acquiredDate)-new Date(a.acquiredDate));
  const total=items.reduce((s,p)=>s+(+p.price||0),0);
  const avg=items.length?Math.round(total/items.length):0;
  document.getElementById('stat-spend').textContent=`$${total.toLocaleString()}`;
  document.getElementById('stat-count').textContent=`${items.length} 筆`;
  document.getElementById('stat-avg').textContent=`$${avg}`;

  const sec=document.getElementById('purchase-sections');
  const empty=document.getElementById('purchase-empty');
  if(!items.length){sec.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';

  const groups={};
  items.forEach(p=>{
    const k=p.acquiredDate.slice(0,7);
    (groups[k]=groups[k]||[]).push(p);
  });

  sec.innerHTML=Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(ym=>{
    const [y,m]=ym.split('-');
    const gs=groups[ym];
    const mt=gs.reduce((s,p)=>s+(+p.price||0),0);
    const rows=gs.map(p=>{
      const dur=duration(p.acquiredDate);
      return `
      <div class="purchase-item">
        <div class="purchase-icon">${EMOJI[p.type]||'🪴'}</div>
        <div class="purchase-info">
          <div class="purchase-name">${esc(p.name)}</div>
          <div class="purchase-sub">${esc(p.shop||'未知店家')} · ${p.acquiredDate} · ${dur===null?'今天剛到家 🎉':'已養 '+dur}</div>
        </div>
        <div class="purchase-price-col">
          <div class="purchase-amount">$${(+p.price).toLocaleString()}</div>
          <div class="purchase-type">${esc(p.type)}</div>
        </div>
      </div>`;
    }).join('');
    return `
    <div class="month-group">
      <div class="month-header">
        <span>${y} 年 ${+m} 月</span>
        <span class="month-total">共 $${mt.toLocaleString()} · ${gs.length} 筆</span>
      </div>
      <div class="purchase-list">${rows}</div>
    </div>`;
  }).join('');
}

// ── Render Wishlist ────────────────────────────
function renderWish(){
  const list=document.getElementById('wish-list');
  const empty=document.getElementById('wish-empty');
  if(!wishes.length){list.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  list.innerHTML=wishes.map((w,i)=>`
  <div class="wish-item${w.done?' done':''}">
    <div class="wish-check${w.done?' checked':''}" onclick="toggleWish(${i})">${w.done?'✓':''}</div>
    <div style="flex:1">
      <div class="wish-name">${esc(w.name)}</div>
      ${w.note?`<div class="wish-note-text">${esc(w.note)}</div>`:''}
    </div>
    <button class="wish-del" onclick="delWish(${i})">×</button>
  </div>`).join('');
}

document.getElementById('btn-add-wish').addEventListener('click',()=>{
  const n=document.getElementById('wish-input').value.trim();
  if(!n)return;
  wishes.unshift({name:n,note:document.getElementById('wish-note-input').value.trim(),done:false});
  document.getElementById('wish-input').value='';
  document.getElementById('wish-note-input').value='';
  saveWishes();renderWish();
});
document.getElementById('wish-input').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-add-wish').click();});
window.toggleWish=i=>{wishes[i].done=!wishes[i].done;saveWishes();renderWish();};
window.delWish=i=>{wishes.splice(i,1);saveWishes();renderWish();};

// ── Timeline / Diary ───────────────────────────
window.openDiary=function(id){
  diaryId=id;
  const p=plants.find(x=>x.id===id);
  document.getElementById('diary-modal-title').textContent=`📖 ${p?p.name:''}的成長日記`;
  document.getElementById('tl-new-text').value='';
  renderTimeline();
  document.getElementById('modal-diary').classList.add('open');
};

function renderTimeline(){
  const entries=diaries[diaryId]||[];
  const wrap=document.getElementById('timeline-wrap');
  if(!entries.length){
    wrap.innerHTML='<div class="tl-empty">還沒有日記，開始記錄吧 🌱</div>';
    return;
  }
  wrap.innerHTML=[...entries].reverse().map((e,ri)=>{
    const idx=entries.length-1-ri;
    return `
    <div class="tl-entry">
      <div class="tl-dot"></div>
      <div class="tl-date-row">
        <span class="tl-date">${e.date}</span>
        <button class="tl-del" onclick="delTlEntry(${idx})">× 刪除</button>
      </div>
      <div class="tl-text">${esc(e.text).replace(/\n/g,'<br>')}</div>
    </div>`;
  }).join('');
}

document.getElementById('btn-add-tl').addEventListener('click',()=>{
  const text=document.getElementById('tl-new-text').value.trim();
  if(!text)return;
  if(!diaries[diaryId])diaries[diaryId]=[];
  diaries[diaryId].push({date:TODAY,text});
  document.getElementById('tl-new-text').value='';
  saveDiaries();renderTimeline();renderPlants();
});

window.delTlEntry=function(i){
  if(!confirm('確定刪除這則記錄？'))return;
  diaries[diaryId].splice(i,1);
  saveDiaries();renderTimeline();renderPlants();
};

['diary-modal-close','modal-diary'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    if(e.target.id==='modal-diary'||e.target.id==='diary-modal-close'){
      document.getElementById('modal-diary').classList.remove('open');diaryId=null;
    }
  });
});

// ── Card photo ────────────────────────────────
window.triggerCardPhoto=function(id){
  document.getElementById(`cpi-${id}`).click();
};
window.onCardPhoto=function(evt,id){
  evt.stopPropagation();
  const f=evt.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    plants=plants.map(p=>p.id===id?{...p,photo:e.target.result}:p);
    savePlants();renderPlants();
  };
  r.readAsDataURL(f);
};

// ── Search & filter ───────────────────────────
document.getElementById('search-input').addEventListener('input',renderPlants);
document.getElementById('filter-type').addEventListener('change',renderPlants);

// ── Plant Modal ───────────────────────────────
const mPlant=document.getElementById('modal-plant');

function openPlantModal(title){
  document.getElementById('modal-plant-title').textContent=title;
  const sa=loaded?.savedAt;
  document.getElementById('version-note').textContent=
    `資料版本 v${DATA_V}　·　上次儲存：${sa?new Date(sa).toLocaleString('zh-TW'):'—'}`;
  // set max date to today
  document.getElementById('f-date').max=TODAY;
  mPlant.classList.add('open');
}
function closePlantModal(){mPlant.classList.remove('open');editingId=null;pendingPhoto=null;}

document.getElementById('plant-modal-close').addEventListener('click',closePlantModal);
document.getElementById('btn-plant-cancel').addEventListener('click',closePlantModal);
mPlant.addEventListener('click',e=>{if(e.target===mPlant)closePlantModal();});

// photo preview in form
document.getElementById('f-photo-file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    pendingPhoto=ev.target.result;
    const img=document.getElementById('photo-preview');
    img.src=pendingPhoto;img.style.display='block';
    document.getElementById('photo-placeholder').style.display='none';
  };
  r.readAsDataURL(f);
});

function resetForm(){
  pendingPhoto=null;
  const img=document.getElementById('photo-preview');
  img.src='';img.style.display='none';
  document.getElementById('photo-placeholder').style.display='flex';
  ['f-name','f-price','f-shop','f-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-type').value='觀葉';
  document.getElementById('f-location').value='陽台';
  document.getElementById('f-water').value='每週一次';
  document.getElementById('f-light').value='散射光';
  document.getElementById('f-date').value=TODAY;
}

function fillForm(p){
  pendingPhoto=p.photo||null;
  const img=document.getElementById('photo-preview');
  if(p.photo){img.src=p.photo;img.style.display='block';document.getElementById('photo-placeholder').style.display='none';}
  else{img.src='';img.style.display='none';document.getElementById('photo-placeholder').style.display='flex';}
  document.getElementById('f-name').value=p.name;
  document.getElementById('f-type').value=p.type;
  document.getElementById('f-location').value=p.location;
  document.getElementById('f-water').value=p.water;
  document.getElementById('f-light').value=p.light;
  document.getElementById('f-date').value=p.acquiredDate;
  document.getElementById('f-price').value=p.price||'';
  document.getElementById('f-shop').value=p.shop||'';
  document.getElementById('f-note').value=p.note||'';
}

function readForm(){
  return{
    name:document.getElementById('f-name').value.trim(),
    type:document.getElementById('f-type').value,
    location:document.getElementById('f-location').value,
    water:document.getElementById('f-water').value,
    light:document.getElementById('f-light').value,
    acquiredDate:document.getElementById('f-date').value,
    price:+document.getElementById('f-price').value||0,
    shop:document.getElementById('f-shop').value.trim(),
    note:document.getElementById('f-note').value.trim(),
    photo:pendingPhoto||'',
  };
}

// future date guard
document.getElementById('f-date').addEventListener('change',e=>{
  if(e.target.value>TODAY){
    alert('入手日期不能是未來日期！');
    e.target.value=TODAY;
  }
});

document.getElementById('btn-open-add').addEventListener('click',()=>{
  editingId=null;resetForm();openPlantModal('➕ 新增植物');
});

window.openEdit=function(id){
  const p=plants.find(x=>x.id===id);if(!p)return;
  editingId=id;fillForm(p);openPlantModal('✏️ 編輯植物');
};

document.getElementById('btn-plant-save').addEventListener('click',()=>{
  const f=readForm();
  if(!f.name)return;
  if(f.acquiredDate>TODAY){alert('入手日期不能是未來日期！');return;}
  if(editingId!==null){
    plants=plants.map(p=>p.id===editingId?{...f,id:editingId}:p);
  }else{
    plants.push({...f,id:nextId++});
  }
  savePlants();closePlantModal();renderAll();
});

window.delPlant=function(id){
  if(!confirm('確定要刪除這株植物嗎？'))return;
  plants=plants.filter(p=>p.id!==id);
  delete diaries[id];
  savePlants();saveDiaries();renderAll();
};

function renderAll(){renderPlants();renderPurchases();renderWish();}

renderAll();
</script>
</body>
</html>
