```html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>🌿 P's 植物日誌 Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>

{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:'Noto Sans TC',sans-serif;
  color:#2f3d2f;

  background:
    radial-gradient(circle at top left,#dce8d8,transparent 35%),
    radial-gradient(circle at bottom right,#efe3d0,transparent 40%),
    #f2ece0;
}

/ ---------- HEADER ---------- /

header{
  position:sticky;
  top:0;
  z-index:100;

  padding:18px 22px 0;

  background:rgba(255,255,255,0.18);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-bottom:1px solid rgba(255,255,255,0.2);
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

.logo{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:16px;
}

.logo-title{
  font-family:'Noto Serif TC',serif;
  font-size:24px;
  color:#5a7e5e;
}

.logo-count{
  font-size:12px;
  opacity:.5;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
}

.tab-btn{
  border:none;
  background:none;
  padding:10px 18px;
  cursor:pointer;

  border-bottom:2px solid transparent;

  font-size:14px;
  color:rgba(0,0,0,.4);

  transition:.2s;
}

.tab-btn.active{
  color:#5a7e5e;
  border-color:#5a7e5e;
  font-weight:700;
}

/ ---------- MAIN ---------- /

main{
  max-width:1100px;
  margin:auto;
  padding:24px 16px 80px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

/ ---------- CONTROLS ---------- /

.controls{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.controls input,
.controls select{
  flex:1;

  min-width:160px;

  background:rgba(255,255,255,.3);

  border:1px solid rgba(255,255,255,.3);

  backdrop-filter:blur(12px);

  border-radius:14px;

  padding:12px 14px;

  font-size:14px;

  color:#2f3d2f;
}

.btn-add{
  border:none;
  cursor:pointer;

  background:linear-gradient(135deg,#7a9e7e,#5a7e5e);

  color:white;

  padding:12px 20px;

  border-radius:14px;

  font-weight:700;
}

/ ---------- STATS ---------- /

.stats{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.stat-card{
  flex:1;
  min-width:140px;

  background:rgba(255,255,255,.28);

  backdrop-filter:blur(16px);

  border:1px solid rgba(255,255,255,.25);

  box-shadow:0 8px 32px rgba(0,0,0,.06);

  border-radius:20px;

  padding:16px;
}

.stat-label{
  font-size:11px;
  opacity:.5;
}

.stat-value{
  margin-top:6px;
  font-size:22px;
  font-weight:700;
  color:#5a7e5e;
}

/ ---------- GRID ---------- /

.plant-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
}

.plant-card{
  position:relative;

  background:rgba(255,255,255,.35);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.3);

  box-shadow:0 8px 32px rgba(0,0,0,.08);

  border-radius:24px;

  overflow:hidden;

  padding:18px;

  transition:.2s;
}

.plant-card:hover{
  transform:translateY(-3px);
}

.plant-photo{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:18px;
  margin-bottom:14px;
}

.new-badge{
  position:absolute;
  top:0;
  right:0;

  background:linear-gradient(135deg,#7a9e7e,#5a7e5e);

  color:white;

  padding:6px 12px;

  border-radius:0 24px 0 16px;

  font-size:10px;
  font-weight:700;
}

.card-top{
  display:flex;
  justify-content:space-between;
}

.card-name{
  font-family:'Noto Serif TC',serif;
  font-size:20px;
  color:#2f3d2f;
}

.card-meta{
  margin-top:4px;
  font-size:12px;
  opacity:.5;
}

.card-actions{
  display:flex;
  gap:6px;
}

.card-actions button{
  border:none;
  cursor:pointer;

  background:rgba(255,255,255,.4);

  backdrop-filter:blur(10px);

  border-radius:10px;

  padding:6px 8px;
}

.card-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;

  margin-top:14px;
}

.info-cell{
  background:rgba(255,255,255,.22);

  border-radius:14px;

  padding:10px;
}

.info-label{
  font-size:10px;
  opacity:.45;
}

.info-value{
  margin-top:3px;
  font-size:13px;
}

.card-note{
  margin-top:14px;
  padding-top:12px;

  border-top:1px solid rgba(255,255,255,.3);

  font-size:12px;
  opacity:.7;
  font-style:italic;
}

/ ---------- TIMELINE ---------- /

.timeline{
  margin-top:14px;
  border-top:1px solid rgba(255,255,255,.3);
  padding-top:12px;
}

.timeline-title{
  font-size:11px;
  opacity:.5;
  margin-bottom:10px;
}

.timeline-item{
  margin-bottom:10px;
}

.timeline-date{
  font-size:10px;
  opacity:.45;
}

.timeline-text{
  font-size:13px;
  margin-top:2px;
}

/ ---------- PURCHASE ---------- /

.purchase-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.purchase-item{
  display:flex;
  justify-content:space-between;
  align-items:center;

  background:rgba(255,255,255,.35);

  backdrop-filter:blur(14px);

  border-radius:18px;

  padding:16px;
}

.monthly-stats{
  display:flex;
  gap:12px;
  overflow:auto;
  margin-bottom:18px;
}

.month-card{
  min-width:140px;

  background:rgba(255,255,255,.3);

  backdrop-filter:blur(14px);

  border-radius:18px;

  padding:14px;
}

/ ---------- WISHLIST ---------- /

.wishlist-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}

.wishlist-card{
  background:rgba(255,255,255,.35);

  backdrop-filter:blur(14px);

  border-radius:20px;

  padding:18px;
}

.wishlist-priority{
  margin-top:8px;
  font-size:12px;
  color:#5a7e5e;
}

/ ---------- MODAL ---------- /

.modal-overlay{
  display:none;

  position:fixed;
  inset:0;

  background:rgba(0,0,0,.35);

  z-index:999;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal-overlay.open{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:520px;

  background:rgba(245,240,232,.72);

  backdrop-filter:blur(24px);

  border-radius:28px;

  padding:28px;

  max-height:90vh;
  overflow:auto;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-title{
  font-size:20px;
  color:#5a7e5e;
  font-family:'Noto Serif TC',serif;
}

.modal-close{
  border:none;
  background:none;
  cursor:pointer;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.span2{
  grid-column:span 2;
}

.form-label{
  display:block;
  margin-bottom:6px;

  font-size:11px;
  opacity:.5;
}

.form-input,
.form-select,
.form-textarea{
  width:100%;

  border:none;

  background:rgba(255,255,255,.35);

  backdrop-filter:blur(10px);

  border-radius:14px;

  padding:12px;

  font-size:14px;
}

.form-textarea{
  resize:vertical;
  min-height:80px;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;

  margin-top:18px;
}

.btn-cancel,
.btn-save{
  border:none;
  cursor:pointer;

  border-radius:14px;

  padding:12px 18px;
}

.btn-save{
  background:linear-gradient(135deg,#7a9e7e,#5a7e5e);
  color:white;
}

.empty{
  text-align:center;
  opacity:.4;
  padding:60px 0;
}

@media(max-width:600px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .span2{
    grid-column:span 1;
  }

}

</style>
</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      <div style="font-size:26px">🌿</div>
      <div class="logo-title">P's 植物日誌</div>
      <div class="logo-count" id="logo-count"></div>
    </div>

    <div class="tabs">

      <button class="tab-btn active" data-tab="plants">
        🪴 我的植物
      </button>

      <button class="tab-btn" data-tab="purchases">
        🛒 購買紀錄
      </button>

      <button class="tab-btn" data-tab="wishlist">
        🌱 Wish List
      </button>

    </div>

  </div>

</header>

<main>

<!-- plants -->

<section class="section active" id="tab-plants">

  <div class="controls">

    <input
      type="text"
      id="search-input"
      placeholder="🔍 搜尋植物、店家、位置..."
    >

    <select id="filter-type">
      <option value="">全部類型</option>
      <option>觀葉</option>
      <option>多肉</option>
      <option>蕨類</option>
      <option>樹木</option>
      <option>其他</option>
    </select>

    <button class="btn-add" id="btn-open-add">
      ＋ 新增植物
    </button>

  </div>

  <div class="stats">

    <div class="stat-card">
      <div class="stat-label">總植物數</div>
      <div class="stat-value" id="stat-total"></div>
    </div>

    <div class="stat-card">
      <div class="stat-label">本月入手</div>
      <div class="stat-value" id="stat-month"></div>
    </div>

    <div class="stat-card">
      <div class="stat-label">今天剛到家</div>
      <div class="stat-value" id="stat-today"></div>
    </div>

  </div>

  <div class="plant-grid" id="plant-grid"></div>

  <div class="empty" id="plant-empty" style="display:none">
    沒有符合條件的植物 🌱
  </div>

</section>

<!-- purchases -->

<section class="section" id="tab-purchases">

  <div class="monthly-stats" id="monthly-stats"></div>

  <div class="purchase-list" id="purchase-list"></div>

</section>

<!-- wishlist -->

<section class="section" id="tab-wishlist">

  <div class="wishlist-grid" id="wishlist-grid"></div>

</section>

</main>

<!-- modal -->

<div class="modal-overlay" id="modal">

  <div class="modal-box">

    <div class="modal-header">
      <div class="modal-title" id="modal-title">
        新增植物
      </div>

      <button class="modal-close" id="modal-close">
        ✕
      </button>
    </div>

    <div class="form-grid">

      <div class="span2">
        <label class="form-label">植物名稱</label>

        <input class="form-input" id="f-name">
      </div>

      <div>
        <label class="form-label">類型</label>

        <select class="form-select" id="f-type">
          <option>觀葉</option>
          <option>多肉</option>
          <option>蕨類</option>
          <option>樹木</option>
          <option>其他</option>
        </select>
      </div>

      <div>
        <label class="form-label">位置</label>

        <select class="form-select" id="f-location">
          <option>陽台</option>
          <option>客廳</option>
          <option>房間</option>
          <option>悶箱</option>
        </select>
      </div>

      <div>
        <label class="form-label">澆水頻率</label>

        <select class="form-select" id="f-water">
          <option>每週一次</option>
          <option>2週一次</option>
          <option>2-3天一次</option>
        </select>
      </div>

      <div>
        <label class="form-label">光照需求</label>

        <select class="form-select" id="f-light">
          <option>散射光</option>
          <option>全日照</option>
          <option>耐陰</option>
        </select>
      </div>

      <div>
        <label class="form-label">入手日期</label>

        <input type="date" class="form-input" id="f-date">
      </div>

      <div>
        <label class="form-label">購入價格</label>

        <input type="number" class="form-input" id="f-price">
      </div>

      <div class="span2">
        <label class="form-label">購入店家</label>

        <input class="form-input" id="f-shop">
      </div>

      <div class="span2">
        <label class="form-label">植物照片</label>

        <input
          type="file"
          accept="image/*"
          class="form-input"
          id="f-image"
        >
      </div>

      <div class="span2">
        <label class="form-label">備忘錄</label>

        <textarea class="form-textarea" id="f-note"></textarea>
      </div>

    </div>

    <div class="form-actions">

      <button class="btn-cancel" id="btn-cancel">
        取消
      </button>

      <button class="btn-save" id="btn-save">
        儲存
      </button>

    </div>

  </div>

</div>

<script>

const STORAGE_VERSION = 2;
const STORAGE_KEY = "plant_journal_pro";

const TYPE_EMOJI = {
  "觀葉":"🌿",
  "多肉":"🪨",
  "蕨類":"🌱",
  "樹木":"🌳",
  "其他":"🪴"
};

const DEFAULT_DATA = {

  version: STORAGE_VERSION,

  plants:[
    {
      id:1,
      name:"白斑龜背芋",
      type:"觀葉",
      location:"客廳",
      water:"每週一次",
      light:"散射光",
      acquiredDate:"2026-05-06",
      price:1800,
      shop:"植物巷弄",

      note:"新葉正在展開 🌱",

      image:"",

      timeline:[
        {
          date:"2026-05-07",
          text:"新芽冒出"
        },
        {
          date:"2026-05-08",
          text:"葉子開始打開"
        }
      ]
    }
  ],

  wishlist:[
    {
      name:"斑葉姬龜背",
      note:"想找奶油斑",
      priority:"高"
    },
    {
      name:"鹿角蕨",
      note:"想做上板",
      priority:"中"
    }
  ]

};

function loadData(){

  const raw = localStorage.getItem(STORAGE_KEY);

  if(!raw) return DEFAULT_DATA;

  try{

    const parsed = JSON.parse(raw);

    if(Array.isArray(parsed)){

      return {
        version: STORAGE_VERSION,
        plants: parsed,
        wishlist:[]
      };

    }

    return parsed;

  }catch{

    return DEFAULT_DATA;

  }

}

let data = loadData();

let plants = data.plants;
let wishlist = data.wishlist;

let nextId =
  plants.reduce((m,p)=>Math.max(m,p.id),0)+1;

let editingId = null;
let currentImage = "";

function save(){

  localStorage.setItem(
    STORAGE_KEY,

    JSON.stringify({
      version: STORAGE_VERSION,
      plants,
      wishlist
    })

  );

}

function esc(s){
  const d=document.createElement("div");
  d.textContent=s || "";
  return d.innerHTML;
}

function calcDuration(dateStr){

  const a = new Date(dateStr);
  const t = new Date();

  if(a > t) return "未來日期";

  a.setHours(0,0,0,0);
  t.setHours(0,0,0,0);

  const total =
    Math.round((t-a)/86400000);

  if(total===0) return null;

  return total + "天";

}

function renderPlants(){

  const q =
    document
    .getElementById("search-input")
    .value
    .trim()
    .toLowerCase();

  const type =
    document
    .getElementById("filter-type")
    .value;

  const filtered = plants.filter(p=>{

    const match =
      !q ||

      p.name.toLowerCase().includes(q) ||

      (p.shop || "")
      .toLowerCase()
      .includes(q) ||

      (p.location || "")
      .toLowerCase()
      .includes(q);

    return match &&
      (!type || p.type===type);

  });

  document.getElementById("logo-count")
  .textContent = plants.length + " 株";

  document.getElementById("stat-total")
  .textContent = plants.length;

  const todayCount =
    plants.filter(p=>
      calcDuration(p.acquiredDate)===null
    ).length;

  document.getElementById("stat-today")
  .textContent = todayCount;

  const now = new Date();

  const monthCount =
    plants.filter(p=>{

      const d = new Date(p.acquiredDate);

      return d.getMonth()===now.getMonth()
        && d.getFullYear()===now.getFullYear();

    }).length;

  document.getElementById("stat-month")
  .textContent = monthCount;

  const grid =
    document.getElementById("plant-grid");

  const empty =
    document.getElementById("plant-empty");

  if(filtered.length===0){

    grid.innerHTML = "";
    empty.style.display = "block";

    return;

  }

  empty.style.display = "none";

  grid.innerHTML =
    filtered.map(p=>{

      const dur =
        calcDuration(p.acquiredDate);

      return        <div class="plant-card">          ${           dur===null           ?<div class="new-badge">NEW</div>`
          : ""
        }

        ${
          p.image
          ? `
            <img
              class="plant-photo"
              src="${p.image}"
            >
          `
          : ""
        }

        <div class="card-top">

          <div>

            <div class="card-name">
              ${esc(p.name)}
            </div>

            <div class="card-meta">
              ${esc(p.type)} · ${esc(p.location)}
            </div>

          </div>

          <div class="card-actions">

            <button onclick="openEdit(${p.id})">
              ✏️
            </button>

            <button onclick="deletePlant(${p.id})">
              🗑
            </button>

          </div>

        </div>

        <div class="card-info">

          <div class="info-cell">
            <div class="info-label">
              💧 澆水
            </div>

            <div class="info-value">
              ${esc(p.water)}
            </div>
          </div>

          <div class="info-cell">
            <div class="info-label">
              ☀️ 光照
            </div>

            <div class="info-value">
              ${esc(p.light)}
            </div>
          </div>

          <div class="info-cell">
            <div class="info-label">
              ⏳ 種植時間
            </div>

            <div class="info-value">
              ${
                dur===null
                ? "今天剛到家 🎉"
                : dur
              }
            </div>
          </div>

          <div class="info-cell">
            <div class="info-label">
              💰 購入價格
            </div>

            <div class="info-value">
              $${(+p.price || 0).toLocaleString()}
            </div>
          </div>

        </div>

        ${
          p.note
          ? `
            <div class="card-note">
              "${esc(p.note)}"
            </div>
          `
          : ""
        }

        ${
          p.timeline?.length
          ? `
            <div class="timeline">

              <div class="timeline-title">
                🌱 成長日記
              </div>

              ${
                p.timeline.map(t=>`

                  <div class="timeline-item">

                    <div class="timeline-date">
                      ${t.date}
                    </div>

                    <div class="timeline-text">
                      ${t.text}
                    </div>

                  </div>

                `).join("")
              }

            </div>
          `
          : ""
        }

      </div>

      `;

    }).join("");

}

function renderPurchases(){

  const sorted =
    [...plants]
    .filter(p=>p.price>0)
    .sort((a,b)=>
      new Date(b.acquiredDate)
      - new Date(a.acquiredDate)
    );

  const monthly = {};

  sorted.forEach(p=>{

    const key =
      p.acquiredDate.slice(0,7);

    monthly[key] =
      (monthly[key] || 0)
      + (+p.price || 0);

  });

  document.getElementById("monthly-stats")
  .innerHTML =

    Object.entries(monthly)
    .map(([month,total])=>`

      <div class="month-card">

        <div style="opacity:.5;font-size:12px">
          ${month}
        </div>

        <div style="margin-top:6px;font-size:22px;font-weight:700;color:#5a7e5e">
          $${total.toLocaleString()}
        </div>

      </div>

    `).join("");

  document.getElementById("purchase-list")
  .innerHTML =

    sorted.map(p=>`

      <div class="purchase-item">

        <div>

          <div style="font-weight:700">
            ${esc(p.name)}
          </div>

          <div style="font-size:12px;opacity:.5;margin-top:4px">
            ${esc(p.shop || "未知店家")}
            ·
            ${p.acquiredDate}
          </div>

        </div>

        <div style="font-weight:700;color:#5a7e5e">
          $${(+p.price).toLocaleString()}
        </div>

      </div>

    `).join("");

}

function renderWishlist(){

  document.getElementById("wishlist-grid")
  .innerHTML =

    wishlist.map(w=>`

      <div class="wishlist-card">

        <div style="font-size:20px">
          🌱
        </div>

        <div style="margin-top:10px;font-weight:700">
          ${esc(w.name)}

function resetForm(){

  const today =
    new Date()
    .toISOString()
    .split("T")[0];

  document.getElementById("f-name").value="";
  document.getElementById("f-type").value="觀葉";
  document.getElementById("f-location").value="陽台";
  document.getElementById("f-water").value="每週一次";
  document.getElementById("f-light").value="散射光";
  document.getElementById("f-date").value=today;
  document.getElementById("f-date").max=today;
  document.getElementById("f-price").value="";
  document.getElementById("f-shop").value="";
  document.getElementById("f-note").value="";
  document.getElementById("f-image").value="";

  currentImage = "";

}

function fillForm(p){

  document.getElementById("f-name").value=p.name;
  document.getElementById("f-type").value=p.type;
  document.getElementById("f-location").value=p.location;
  document.getElementById("f-water").value=p.water;
  document.getElementById("f-light").value=p.light;
  document.getElementById("f-date").value=p.acquiredDate;
  document.getElementById("f-price").value=p.price;
  document.getElementById("f-shop").value=p.shop;
  document.getElementById("f-note").value=p.note;

  currentImage = p.image || "";

}

function readForm(){

  return {

    name:
      document
      .getElementById("f-name")
      .value
      .trim(),

    type:
      document
      .getElementById("f-type")
      .value,

    location:
      document
      .getElementById("f-location")
      .value,

    water:
      document
      .getElementById("f-water")
      .value,

    light:
      document
      .getElementById("f-light")
      .value,

    acquiredDate:
      document
      .getElementById("f-date")
      .value,

    price:
      +document
      .getElementById("f-price")
      .value || 0,

    shop:
      document
      .getElementById("f-shop")
      .value
      .trim(),

    note:
      document
      .getElementById("f-note")
      .value
      .trim()

  };

}

function readImageFile(file){

  return new Promise(resolve=>{

    if(!file){

      resolve(currentImage || "");

      return;

    }

    const reader = new FileReader();

    reader.onload = e=>{

      resolve(e.target.result);

    };

    reader.readAsDataURL(file);

  });

}

document
.getElementById("btn-open-add")
.addEventListener("click",()=>{

  editingId = null;

  resetForm();

  openModal("➕ 新增植物");

});

function openEdit(id){

  const p =
    plants.find(x=>x.id===id);

  if(!p) return;

  editingId = id;

  fillForm(p);

  openModal("✏️ 編輯植物");

}

document
.getElementById("btn-save")
.addEventListener("click",async()=>{

  const f = readForm();

  if(!f.name) return;

  const imageFile =
    document
    .getElementById("f-image")
    .files[0];

  f.image =
    await readImageFile(imageFile);

  f.timeline = [
    {
      date:
        new Date()
        .toISOString()
        .split("T")[0],

      text:"紀錄已更新 🌿"
    }
  ];

  if(editingId!==null){

    plants = plants.map(p=>

      p.id===editingId
      ? {
          ...p,
          ...f
        }
      : p

    );

  }else{

    plants.push({
      ...f,
      id:nextId++
    });

  }

  save();

  closeModal();

  renderAll();

});

window.openEdit = openEdit;

window.deletePlant = function(id){

  if(!confirm("確定要刪除這株植物嗎？")){
    return;
  }

  plants =
    plants.filter(p=>p.id!==id);

  save();

  renderAll();

};

renderAll();

</script>
